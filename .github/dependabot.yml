version: 2
updates:
  # homebrew-core tracks main, which gets over 100 pushes within the default
  # cooldown, so every push is filtered out and it's never updated
  - package-ecosystem: nix
    directory: /busy-branch
    schedule:
      interval: daily
  # disko has no ref, so it's aged by committer date rather than push time
  - package-ecosystem: nix
    directory: /no-ref
    schedule:
      interval: daily
    cooldown:
      default-days: 2
